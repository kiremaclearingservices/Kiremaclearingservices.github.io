<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIREMA CLEARING SERVICES</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#071b33;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 min-height:100vh;
}
.container{
 width:90%;
 max-width:430px;
 text-align:center;
 background:#102d4d;
 padding:35px 25px;
 border-radius:18px;
 box-shadow:0 8px 30px #0008;
}
.logo{
 font-size:48px;
 margin-bottom:10px;
}
h1{font-size:25px;color:#36b8ff}
.subtitle{color:#c5d8e8;line-height:1.6}
hr{border:1px solid #294968;margin:25px 0}
input,button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border-radius:8px;
 border:none;
 font-size:16px;
}
input{background:white;color:#222}
button{
 background:#0788d1;
 color:white;
 font-weight:bold;
}
.footer{font-size:12px;color:#a9bfd2;margin-top:25px}
</style>
</head>
<body>
<div class="container">
 <div class="logo">KCS</div>
 <h1>KIREMA CLEARING SERVICES</h1>
 <p class="subtitle">
  Plateforme de gestion douanière<br>
  Espace sécurisé des déclarants
 </p>
 <hr>
 <h2>Bienvenue</h2>
 <p>Veuillez accéder à votre espace de travail.</p>
 <input type="text" placeholder="Nom d'utilisateur">
 <input type="password" placeholder="Mot de passe">
 <button>Se connecter</button>
 <div class="footer">
  Développé par Alain Claude<br>
  © 2026 KIREMA CLEARING SERVICES
 </div>
</div>
